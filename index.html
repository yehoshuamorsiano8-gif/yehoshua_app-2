<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Architect</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <main id="main-content">
            
            <section id="tab-today" class="tab-content active">
                <div id="story-container">
                    <div id="context-opener" class="story-card active">
                        <h2>איך היה היום שלך?</h2>
                        <div class="context-options">
                            <button onclick="setContext('normal')">יום רגיל</button>
                            <button onclick="setContext('unplanned')">יום בלת"מים</button>
                            <button onclick="setContext('sick')">יום מחלה</button>
                        </div>
                    </div>
                </div>
            </section>
             <div id="tab-feedback" class="tab-content">
                <h2>תשקיף ביצועים</h2>
                <div class="time-filters" style="display: flex; gap: 10px; margin-bottom: 20px;">
                   <button onclick="updateFeedbackRange('today')" class="filter-btn active">היום</button>
                   <button onclick="updateFeedbackRange('week')" class="filter-btn">שבוע</button>
                   <button onclick="updateFeedbackRange('month')" class="filter-btn">חודש</button>
                </div>
                <div class="chart-container" style="margin-top: 40px;">
                    <h3>מגמת Legacy (מבט על)</h3>
                    <canvas id="trendChart"></canvas>
                </div>
                  <canvas id="radarChart"></canvas>
                <div class="chart-box" style="margin-top: 30px; padding: 15px; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                  <h3 style="text-align: center; color: #2c3e50;">מגמת Legacy (ציר זמן)</h3>
                  <canvas id="trendChart"></canvas>
                </div>
                <div id="strategist-insights" style="margin-top: 25px; padding: 20px; background: #fef9e7; border-radius: 12px; border-right: 5px solid #f1c40f; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                  <h3 style="margin-top:0; color: #b7950b;">דבר האסטרטג 🧠</h3>
                    <p id="insight-text" style="line-height: 1.6; color: #2c3e50;">מנתח נתונים ומגמות...</p>
                </div>
            </div>  

            <section id="tab-strategist" class="tab-content"><h2>האסטרטג</h2></section>
            
            <section id="tab-museum" class="tab-content"><h2>ספריית הישגים</h2></section>
             <div id="tab-architect" class="tab-content">
                <div class="mode-selector-container" style="padding: 15px; background: #fff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                  <h3 style="margin-top: 0;">ניהול מצבי חיים ⚙️</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                 <button class="mode-btn active" onclick="setLifeMode('routine')" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer;">🏠 שגרה</button>
                 <button class="mode-btn" onclick="setLifeMode('busy')" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer;">📚 עומס</button>
                 <button class="mode-btn" onclick="setLifeMode('vacation')" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer;">🏖️ חופשה</button>
                 <button class="mode-btn" onclick="setLifeMode('emergency')" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer;">🎖️ מילואים</button>
                </div>
                </div>
             </div>
            <section id="tab-architect" class="tab-content">
                <h2>האדריכל</h2>
                <div class="admin-controls" style="margin-top: 50px; padding: 20px; border: 1px dashed red;">
                    <h3>ניהול נתונים מאובטח</h3>
                    <p style="font-size: 0.8rem;">מחיקת נתונים היא פעולה בלתי הפיכה.</p>
                    <button onclick="LegacyCloud.secureDeleteAll()" style="background: #e74c3c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">מחיקת כל הנתונים מהענן</button>
                </div>
            </section>
        </main>

        <nav id="bottom-nav">
            <button onclick="switchTab('today')" class="nav-item active">היום שלי</button>
            <button onclick="switchTab('feedback')" class="nav-item">משוב</button>
            <button onclick="switchTab('strategist')" class="nav-item">האסטרטג</button>
            <button onclick="switchTab('museum')" class="nav-item">ספריה</button>
            <button onclick="switchTab('architect')" class="nav-item">אדריכל</button>
        </nav>
    </div>

    <script src="architect.js"></script>
    <script src="data.js"></script>
    <script src="cloud.js"></script> 
    <script src="logic.js"></script>
</body>
</html>
